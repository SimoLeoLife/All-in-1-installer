name: Build

# Every push and pull request builds both single-file programs, so a broken build is caught before it is
# merged. Pushing a tag like v1.1.0 also publishes them as a release, which is what the installer's own
# update check at startup looks for.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            extension: '.exe'
          - os: ubuntu-latest
            rid: linux-x64
            extension: ''
    steps:
      - uses: actions/checkout@v7

      # global.json asks for a .NET 11 SDK and allows prereleases, so the preview channel is what matches.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Publish
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          args=(-c Release -r "$RID" --self-contained true
                -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
                -p:DebugType=none -p:DebugSymbols=false)
          # On a tag the program reports the tag as its version. Without this a released build would keep
          # offering itself as an update, because the startup check compares the tag with this number.
          case "$GITHUB_REF" in
            refs/tags/v*) args+=("-p:Version=${GITHUB_REF#refs/tags/v}") ;;
          esac
          dotnet publish "SourceCode/All-in-1 Installer.csproj" "${args[@]}" -o "publish/$RID"

      # The update check picks the release file by name: the .exe on Windows, the one with "linux" in it
      # otherwise, preferring the name that matches the machine's architecture.
      - name: Name the file after the platform
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          set -euo pipefail
          cd "publish/$RID"
          mv "All-in-1 Installer$EXTENSION" "All-in-1 Installer $RID$EXTENSION"
          ls -la

      - uses: actions/upload-artifact@v7
        with:
          name: All-in-1 Installer ${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/All-in-1 Installer ${{ matrix.rid }}${{ matrix.extension }}
          if-no-files-found: error

  release:
    name: Release
    # Only for a tag, and only when both programs were built.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' file; do files+=("$file"); done \
            < <(find artifacts -type f -name 'All-in-1 Installer *' -print0 | sort -z)
          [ "${#files[@]}" -gt 0 ] || { echo "The build produced no program to release."; exit 1; }
          printf '%s\n' "${files[@]}"
          gh release create "${GITHUB_REF#refs/tags/}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${GITHUB_REF#refs/tags/}" \
            --generate-notes \
            "${files[@]}"
